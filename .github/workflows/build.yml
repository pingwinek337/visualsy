name: Build mod

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Build
        run: |
          set +e
          gradle build --no-daemon --console=plain > build.log 2>&1
          code=$?
          grep -E "error:" build.log | sort -u | head -8 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          sed -n '/What went wrong/,/Try:/p' build.log | head -14 | tr '\n' '|' | sed 's/%/%25/g; s/^/::error::/'
          echo
          exit $code

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: penguin-visuals
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Release (sam jar, bez zipa)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          gh release create "build-${{ github.run_number }}" "$JAR" \
            --title "Penguin Visuals build ${{ github.run_number }}" \
            --notes "Automatyczny build z commita ${{ github.sha }}" --latest
